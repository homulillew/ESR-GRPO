[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esr-grpo"
version = "0.1.0"
description = "Evidence-State Routing for action-level credit assignment in long-horizon agent search"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "Apache-2.0"}
authors = [{name = "ESR-GRPO authors"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]
config = ["pyyaml>=6.0,<7"]
browsecomp = [
  "datasets>=4.0,<5",
  "openai>=1.97,<3",
  "pandas>=2.2,<3",
  "pyarrow>=19,<24",
]
download = ["huggingface-hub>=0.34,<2"]
train = [
  "hydra-core==1.3.2",
  "numpy==1.26.4",
  "ray[default]==2.54.1",
  "tensordict==0.10.0",
  "torch==2.7.1",
]

[project.scripts]
esr-grpo = "esr_grpo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
